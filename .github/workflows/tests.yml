name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: specimen-label-entry/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r specimen-label-entry/requirements.txt
      - name: Check release manifest and installation plan
        run: python install.py --host all --dry-run
      - name: Test image processing, grids and workbooks
        run: python -m unittest discover -s specimen-label-entry/scripts -p 'test_*.py' -v
      - name: Test installation, backups and rollback
        run: python -m unittest discover -s tests -v
